<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hub</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="account" id="account" hidden>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="account-name" id="account-name"></span>
      <button class="sign-out" id="sign-out" type="button">Sign out</button>
    </div>
    <header class="masthead">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1 id="greeting">Hello.</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="next-up" id="next-up" hidden>
        <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" id="next-icon"></svg></span>
        <div><small id="next-kicker"></small><strong id="next-title"></strong><span class="when" id="next-when"></span></div>
      </div>
    </header>

    <div id="error" class="error-banner" role="alert" hidden></div>

    <div class="toolbar">
      <label class="search"><span class="visually-hidden">Search apps</span>
        <input id="search" type="search" placeholder="Search apps…" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="segmented" id="groups" role="group" aria-label="Filter by category"></div>
      <p class="summary" id="summary" role="status"></p>
    </div>

    <section id="apps" class="grid" aria-label="Your apps"></section>

    <footer>
      <span>Your data stays on the laptop and your devices; sync is local.</span>
      <span>Keys <kbd>1</kbd>–<kbd>9</kbd> open an app · <kbd>/</kbd> searches · <kbd>T</kbd> switches theme</span>
    </footer>
  </main>
</body>
</html>
