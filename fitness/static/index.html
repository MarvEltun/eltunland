<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myFitness</title>
  <link rel="icon" href="static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/hub-link.css">
  <link rel="stylesheet" href="static/style.css">
  <script src="static/app.js" defer></script>
</head>
<body>
  <a class="hub-link right" href="/" aria-label="Back to hub">⌂ Hub</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="myFitness home"><span class="brand-mark" aria-hidden="true"></span>my<b>Fitness</b></a>
    <button class="button primary" id="new-workout" disabled>＋ Log workout</button>
  </header>

  <main>
    <div id="global-error" class="error-banner" role="alert" hidden></div>

    <section class="hero" aria-label="This week">
      <article class="card ring-card">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="52"/><circle class="ring-value" id="ring-value" cx="60" cy="60" r="52"/></svg>
          <div class="ring-text"><strong id="ring-percent">0%</strong><span>of goal</span></div>
        </div>
        <div>
          <p class="eyebrow">THIS WEEK</p>
          <h1><span id="week-minutes">0</span> <small>of <span id="goal-minutes">150</span> min</small></h1>
          <p class="lead" id="week-message"></p>
          <button class="text-button" id="edit-goal">Change weekly goal</button>
        </div>
      </article>
      <article class="card stat"><span>Streak</span><strong id="streak">0</strong><small id="streak-note">days in a row</small></article>
      <article class="card stat"><span>This month</span><strong id="month-count">0</strong><small>workouts</small></article>
      <article class="card stat"><span>Distance this month</span><strong id="month-distance">0</strong><small>km</small></article>
    </section>

    <section class="card chart-card" aria-label="Last eight weeks">
      <div class="section-head"><h2>Last 8 weeks</h2><span class="legend"><i></i> weekly goal</span></div>
      <svg id="weeks-chart" viewBox="0 0 640 220" role="img" aria-label="Minutes of exercise per week for the last eight weeks"></svg>
    </section>

    <section aria-label="Workouts">
      <div class="section-head"><h2>Recent workouts</h2><span class="muted" id="workout-count"></span></div>
      <div id="workout-list" class="workout-list"></div>
      <button class="button full" id="show-more" hidden>Show more</button>
    </section>
  </main>

  <dialog id="workout-dialog">
    <form id="workout-form">
      <div class="dialog-heading"><h2 id="workout-dialog-title">Log a workout</h2><button class="icon-button" id="close-workout" type="button" aria-label="Close">×</button></div>
      <input type="hidden" id="workout-id">
      <div class="field-row">
        <div><label class="field-label" for="workout-day">Date</label><input type="date" id="workout-day" required></div>
        <div><label class="field-label" for="workout-kind">Type</label><select id="workout-kind"></select></div>
      </div>
      <div class="field-row">
        <div><label class="field-label" for="workout-minutes">Minutes</label><input type="number" id="workout-minutes" min="1" max="1440" step="1" required></div>
        <div><label class="field-label" for="workout-distance">Distance (km, optional)</label><input type="number" id="workout-distance" min="0.1" max="1000" step="0.1"></div>
      </div>
      <label class="field-label" for="workout-effort">How hard did it feel?</label>
      <select id="workout-effort">
        <option value="1">1 · Very easy</option><option value="2">2 · Easy</option><option value="3" selected>3 · Moderate</option>
        <option value="4">4 · Hard</option><option value="5">5 · Very hard</option>
      </select>
      <label class="field-label" for="workout-notes">Notes</label>
      <textarea id="workout-notes" rows="3" maxlength="1000" placeholder="How did it go?"></textarea>
      <div id="workout-error" class="error-banner" role="alert" hidden></div>
      <button class="button primary full" id="save-workout" type="submit">Save workout</button>
    </form>
  </dialog>

  <dialog id="goal-dialog">
    <form id="goal-form">
      <div class="dialog-heading"><h2>Weekly goal</h2><button class="icon-button" id="close-goal" type="button" aria-label="Close">×</button></div>
      <p class="muted">The World Health Organization suggests at least 150 minutes of moderate activity a week.</p>
      <label class="field-label" for="goal-input">Minutes per week</label>
      <input type="number" id="goal-input" min="10" max="2000" step="5" required>
      <div id="goal-error" class="error-banner" role="alert" hidden></div>
      <button class="button primary full" type="submit">Save goal</button>
    </form>
  </dialog>

  <dialog id="delete-dialog">
    <h2>Delete this workout?</h2>
    <p id="delete-name"></p>
    <div class="dialog-actions"><button class="button" id="cancel-delete">Keep it</button><button class="button danger" id="confirm-delete">Delete</button></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
